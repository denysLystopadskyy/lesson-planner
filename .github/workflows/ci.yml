# Checks every pull request: formatting, lint, types, the end-to-end suite,
# and the TDD evidence of the branch (plan batch T.3).
#
# ADVISORY UNTIL MADE REQUIRED. A red run here does not block a merge yet.
# Making it a required status check is a repository Settings change that only
# the owner can do: Settings -> Branches -> add a rule for `main` -> Require
# status checks to pass -> select "checks". Same class of owner-only action as
# the Pages publishing-source switch in plan batch 2a.2.
#
# This workflow does not deploy. Publishing is still branch-based from `main`
# (see .claude/context/deployment.md); batch 2a.2 introduces the deploy
# workflow separately.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The suite compares screenshots against committed PNGs, and a screenshot
    # records one renderer and one font inventory. `ubuntu-latest` is a rolling
    # label whose OS and font packages move under it on GitHub's schedule, so
    # the same code would eventually render differently and turn the suite red
    # on a week nobody touched the UI. This is the same image the baselines are
    # made in — pinned by digest, because the tag is mutable too.
    # Re-pin: see .claude/context/testing.md.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # 64 MB of /dev/shm makes Chromium crash at random. Playwright's own
      # Docker guidance.
      options: --ipc=host

    steps:
      - uses: actions/checkout@v4

      # No actions/setup-node and no browser cache: the image ships both the
      # pinned Node and the matching browsers, already installed.
      - run: npm ci

      - name: The image must match the pinned Playwright
        env:
          PW_IMAGE_TAG: v1.63.0-noble
        run: |
          want="v$(node -p "require('@playwright/test/package.json').version")-noble"
          if [ "$want" != "$PW_IMAGE_TAG" ]; then
            echo "::error::package.json wants $want, this job runs $PW_IMAGE_TAG."
            echo "Re-pin the container digest in ci.yml, deploy.yml and baselines.yml."
            exit 1
          fi

      # Each check runs even if an earlier one failed, so one push reports every
      # problem rather than only the first.
      - run: npm run format:check
        if: "!cancelled()"

      - run: npm run lint
        if: "!cancelled()"

      - run: npm run typecheck
        if: "!cancelled()"

      # The root tsconfig includes only `e2e/**` and `playwright.config.ts`, so
      # the step above never looks at `app/src` — where nearly every change
      # lands. Until this was added, a type error in the app could not turn a PR
      # red, and `deploy.yml` was the only thing that would have caught it,
      # after merge. Written in plan batch 3.5 and pushed here once the token
      # had `workflow` scope.
      - run: npm run typecheck:app
        if: "!cancelled()"

      # The backend and the scripts that run it. `api/tsconfig.json` is a third
      # project: the root config covers `e2e/` only and `app/tsconfig.json`
      # resolves like a bundler, so neither would look at `api/`. Added with the
      # API skeleton in plan batch 4.2.
      - run: npm run typecheck:api
        if: "!cancelled()"

      # Bank and tax identifier shapes in tracked source (plan batch 3.5,
      # DEF-015). The script self-tests its own patterns on every run, so a
      # regex edited into uselessness fails here rather than passing forever.
      - run: npm run check:pii
        if: "!cancelled()"

      - run: npm run test:unit
        if: "!cancelled()"

      - run: npx playwright test
        if: "!cancelled()"

      # Traces, video and screenshots are kept on failure. Specs that render the
      # payment template seed their own, so the owner's real identifiers do not
      # reach these artifacts — see .claude/context/security-auth.md.
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: junit
          path: test-results/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  # The TDD evidence of a pull request (plan batch T.3; testing.md §1.5). For
  # each Red row on the changed batch page, it checks out that commit, expects
  # the stated command to fail with the stated message, and then expects the
  # same command to pass at the head. A named exception is reported, not
  # verified. Advisory, like the job above.
  #
  # Only on pull requests: a push to main has no branch to compare.
  tdd-evidence:
    name: tdd-evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host

    steps:
      - uses: actions/checkout@v4
        with:
          # The branch head, not the merge commit that a pull request run
          # checks out by default: the green run must test what was pushed.
          ref: ${{ github.event.pull_request.head.sha }}
          # The whole history, so the Red commit and the merge base are here.
          fetch-depth: 0

      - run: npm ci

      - run: node scripts/check-tdd-evidence.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
