# Publishes the site to GitHub Pages.
#
# INERT UNTIL THE OWNER FLIPS TWO SWITCHES. Publishing is still branch-based
# from `main` at the time of writing, so this workflow builds and then stops:
# the deploy job runs only when the repository variable PAGES_ACTIONS is
# "true". That lets this land, and be reviewed, without touching the live site.
#
# The runbook for the flip is in docs/plan/p2a-02-deploy-workflow-runbook.md.
#
# What it publishes, since the cutover in plan batch 2a.4:
#   /  the React build, with UNPREFIXED storage keys — it is the real app now
#
# Before the cutover this also published the same build at /next/ with `next:`
# keys, so staging could share an origin with the live page and not touch its
# data. There is one app now, so there is nothing to keep apart.
#
# Note that switching to Actions also stops publishing the repository's other
# files. Today `docs/` and the raw `app/` sources are served because Pages
# copies the whole branch; after the flip only what is assembled below is.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same checks CI runs. The deploy job depends on this, so a red suite
  # cannot publish.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The suite compares screenshots against committed PNGs, and a screenshot
    # records one renderer and one font inventory. `ubuntu-latest` is a rolling
    # label whose OS and font packages move under it on GitHub's schedule, so
    # the same code would eventually render differently and turn the suite red
    # on a week nobody touched the UI. This is the same image the baselines are
    # made in — pinned by digest, because the tag is mutable too.
    # Re-pin: see .claude/context/testing.md.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # 64 MB of /dev/shm makes Chromium crash at random. Playwright's own
      # Docker guidance.
      options: --ipc=host

    steps:
      - uses: actions/checkout@v4
      # The image ships the pinned Node and the matching browsers. This job
      # gates the deploy, so it must run in the same environment the baselines
      # were made in — otherwise it is the one mismatched check standing in
      # front of the live site.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:app
      - run: npm run test:unit
      - run: npx playwright test

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      # This is a project Pages site, so the app is served from
      # /lesson-planner/ and `base` must match it exactly or every asset 404s.
      # No VITE_STORAGE_PREFIX: the build reads and writes the real keys, which
      # is the whole of the cutover — see
      # .claude/context/storage-data-contract.md.
      - name: Build the React app
        run: npx vite build --config app/vite.config.ts --base=/lesson-planner/

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R app/dist/. site/
          echo "--- assembled ---"
          find site -type f | sort
          echo "--- no prefixed keys in the bundle? ---"
          ! grep -rq "next:groupLessonPlannerData" site && echo "none"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    # The gate. Until the owner sets this variable, the workflow builds,
    # proves the artifact assembles, and stops.
    if: vars.PAGES_ACTIONS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
